---
name: Build and push Shielder-Prover-TEE docker image

on:
  workflow_call:
    inputs:
      ref:
        description: 'git ref: hash, branch, tag to build shielder-prover-tee files from'
        type: string
        required: true

jobs:
  main:
    name: Build Shielder Prover TEE
    runs-on: github-large-runner-x64-4-cpu-16-gb-ram-150-gb-disk
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Call action get-ref-properties
        id: get-ref-properties
        uses: Cardinal-Cryptography/github-actions/get-ref-properties@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Public Amazon ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ECR_PUBLIC_HOST }}
          username: ${{ secrets.AWS_MAINNET_ECR_CC_ACCESS_KEY_ID }}
          password: ${{ secrets.AWS_MAINNET_ECR_CC_ACCESS_KEY }}

      - name: Build and push docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./crates/shielder-prover-tee/Dockerfile
          push: true
          # yamllint disable rule:line-length
          tags: |
            ${{ vars.ECR_CC_RES_PUBLIC_REGISTRY }}shielder-prover:tee-${{ steps.get-ref-properties.outputs.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}shielder-prover:tee-latest', vars.ECR_CC_RES_PUBLIC_REGISTRY) || '' }}

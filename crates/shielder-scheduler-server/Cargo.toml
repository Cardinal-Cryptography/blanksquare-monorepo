[package]
name = "shielder-scheduler-server"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
repository = { workspace = true }

[dependencies]
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-signer-local = { workspace = true }
axum = { workspace = true, features = ["tokio", "macros"] }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive", "env"] }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shielder-scheduler-common = { workspace = true }
shielder-setup = { workspace = true }
shielder-account = { workspace = true }
shielder-contract = { workspace = true }
shielder-relayer = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread"] }
tokio-task-pool = { workspace = true, features = ["log"] }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
vsock = { workspace = true }

[features]
local-run = []
